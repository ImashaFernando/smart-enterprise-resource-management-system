<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction | SERMS</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/finance.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="main">

    <div class="topbar">
        <div>
            <p class="eyebrow">FINANCE MODULE</p>
            <h1>Add Transaction</h1>
        </div>
    </div>

    <div class="form-container">

        <form th:action="@{/finance/save}"
              th:object="${finance}"
              method="post"
              class="finance-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="transactionCode">Transaction Code</label>
                    <input
                            id="transactionCode"
                            type="text"
                            th:field="*{transactionCode}"
                            placeholder="TRX001"
                            required>
                </div>

                <div class="form-group">
                    <label for="transactionType">Transaction Type</label>
                    <select id="transactionType"
                            th:field="*{transactionType}"
                            required>

                        <option value="">-- Select --</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input
                            id="category"
                            type="text"
                            th:field="*{category}"
                            placeholder="Salary / Donation / Office Rent"
                            required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                            id="amount"
                            type="number"
                            step="0.01"
                            th:field="*{amount}"
                            required>
                </div>

                <div class="form-group">
                    <label for="transactionDate">Transaction Date</label>
                    <input
                            id="transactionDate"
                            type="date"
                            th:field="*{transactionDate}"
                            required>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>

                    <select id="paymentMethod"
                            th:field="*{paymentMethod}">

                        <option value="">-- Select --</option>
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Cheque">Cheque</option>

                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>

                    <textarea
                            id="description"
                            rows="4"
                            th:field="*{description}"
                            placeholder="Enter description">
                    </textarea>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status"
                            th:field="*{status}">

                        <option value="Pending">Pending</option>
                        <option value="Paid">Paid</option>
                        <option value="Completed">Completed</option>

                    </select>
                </div>

            </div>

            <div class="form-buttons">

                <button type="submit" class="save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Transaction
                </button>

                <a th:href="@{/finance}" class="cancel-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
